version: "3"
services:
  redis:
    image: redis:alpine
    networks:
      - app_network
    ports:
      - "6379:6379"
    restart: always

  restapp:
    build: .
    networks:
      - app_network
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: always

networks:
  app_network:
    driver: bridge
