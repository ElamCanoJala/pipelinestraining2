name: CI

on:
  push:
    branches: ["elamCano_p2_dev", "elamCano_p2_base"]

  workflow_dispatch:

env:
  SEM_VERSION: ""
  IMAGE_NAME: ""

jobs:
  ## 🌱 0. Set variables
  Set-vars:
    runs-on: ubuntu-latest
    outputs:
      SEM_VERSION: ${{ steps.set-vars.outputs.SEM_VERSION }}
      IMAGE_NAME: ${{ steps.set-vars.outputs.IMAGE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Necesario para contar todos los commits

      - name: Get semantic version and image name
        id: set-vars
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          BASE_VERSION="1.0"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          SEM_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          IMAGE_NAME="${BRANCH_NAME}-${SEM_VERSION}"
          echo "SEM_VERSION=$SEM_VERSION"
          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "SEM_VERSION=$SEM_VERSION" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT

  ## 🔧 1.
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run unit tests
        run: pytest test/unit -v

      - name: Run flake8 (simple code inspection)
        run: |
          flake8 . --exclude=venv,__pycache__ --max-line-length=100

  ## 🔧 2.
  Build:
    runs-on: ubuntu-latest
    needs: [Static-codecheck, Set-vars]
    env:
      IMAGE_NAME: ${{ needs.set-vars.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t "${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_NAME }}" .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_NAME }}"

  ## 🚀 3.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [Build, Set-vars]
    environment:
      name: Develop
      url: http://localhost:5000
    env:
      IMAGE_NAME: ${{ needs.set-vars.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Pull restapp image from Docker Hub
        run: docker pull elamcano/restapp:${{ env.IMAGE_NAME }}

      - name: Check if redis exist
        run: |
          docker stop redisService || true
          docker rm redisService || true

      - name: Start Redis container
        run: docker run --name redisService --network redis -p 6379:6379 -d redis:alpine

      - name: Check if restapp exist
        run: |
          docker stop restapp || true
          docker rm restapp || true

      - name: Get ip dinamically
        run: redisIP = (docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redisService)

      - name: Start restapp container
        run: docker run --name restapp --network redis -p 5000:5000 -d elamcano/${{ env.IMAGE_NAME }}

      - name: Run integration tests
        run: docker exec restapp sh -c "python -m pytest test/integration -v"

  ## 🚀 4.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: Production
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
#
