name: CI

on:
  push:
    branches: ["elamCano_p2_dev", "elamCano_p2_base"]

  workflow_dispatch:

env:
  SEM_VERSION: ""
  IMAGE_NAME: ""

jobs:
  ## 🔧 1.
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run unit tests
        run: pytest test/unit -v

      - name: Run flake8 (simple code inspection)
        run: |
          flake8 . --exclude=venv,__pycache__ --max-line-length=100

  ## 🔧 2.
  Build:
    runs-on: ubuntu-latest
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set image tag from branch name
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "IMAGE_TAG=${BRANCH_NAME}-1.0.0" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t "${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_TAG }}" .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_TAG }}"

  ## 🚀 3.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: Build
    environment:
      name: Develop
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag from branch name
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "IMAGE_TAG=${BRANCH_NAME}-1.0.0" >> $GITHUB_ENV

      - name: Pull restapp image from Docker Hub
        run: docker pull elamcano/restapp:${{ env.IMAGE_TAG }}

      - name: Start Redis container
        run: docker run -d --name redisService -p 6379:6379 redis

      - name: Start restapp container
        run: docker run -d --name restappContainer --link redisService \
          -e REDIS_HOST=redisService -p 5000:5000 elamcano/restapp:${{ env.IMAGE_TAG }}

      - name: Wait for restapp to be ready
        run: |
          for i in {1..10}; do
            curl -s http://localhost:5000 && break
            echo "Waiting for app to start..."
            sleep 3
          done

      - name: Run integration tests
        run: |
          pip install -r requirements.txt
          pytest test/integration -v

  ## 🚀 4.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: Production
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
