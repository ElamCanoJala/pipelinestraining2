name: CI

on:
  push:
    branches: ["elamCano_p2_dev", "elamCano_p2_base"]

  workflow_dispatch:

env:
  SEM_VERSION: ""
  IMAGE_NAME: ""

jobs:
  ## 🔧 1.
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run unit tests
        run: pytest test/unit -v

      - name: Run flake8 (simple code inspection)
        run: |
          flake8 . --exclude=venv,__pycache__ --max-line-length=100

  ## 🔧 2.
  Build:
    runs-on: ubuntu-latest
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  ## 🚀 3.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: Build
    environment:
      name: Develop
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  ## 🚀 4.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: Production
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
