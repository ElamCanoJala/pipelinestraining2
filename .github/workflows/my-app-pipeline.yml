name: CI

on:
  push:
    branches: ["elamCano_p2_dev", "elamCano_p2_base"]

  workflow_dispatch:

env:
  SEM_VERSION: ""
  IMAGE_NAME: ""

jobs:
  ### 🌱 0. Set variables
  Set-vars:
    runs-on: ubuntu-latest
    outputs:
      SEM_VERSION: ${{ steps.set-vars.outputs.SEM_VERSION }}
      IMAGE_NAME: ${{ steps.set-vars.outputs.IMAGE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get semantic version and image name
        id: set-vars
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          BASE_VERSION="1.0"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          SEM_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          IMAGE_NAME="${BRANCH_NAME}-${SEM_VERSION}"
          echo "SEM_VERSION=$SEM_VERSION"
          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "SEM_VERSION=$SEM_VERSION" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT

  ## 🔧 1.
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run unit tests
        run: pytest test/unit -v

      - name: Run flake8 (simple code inspection)
        run: |
          flake8 . --exclude=venv,__pycache__ --max-line-length=100

  ## 🔧 2.
  Build:
    runs-on: ubuntu-latest
    needs: [Static-codecheck, Set-vars]
    env:
      IMAGE_NAME: ${{ needs.set-vars.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t "${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_NAME }}" .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.IMAGE_NAME }}"

  ## 🚀 3. Deploy to dev
  Deploy-dev:
    runs-on: ubuntu-latest
    needs: [Build, Set-vars]
    environment:
      name: Develop
      url: http://localhost:5000
    env:
      IMAGE_NAME: ${{ needs.set-vars.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file for docker-compose
        run: echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" > .env

      - name: Set up Docker Compose
        run: |
          sudo apt-get install -y docker-compose

      - name: Pull restapp image from Docker Hub
        run: docker pull elamcano/restapp:${{ env.IMAGE_NAME }}

      - name: Start services with Docker Compose
        run: |
          docker-compose up -d

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      # - name: Install dependencies for integration test
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt

      # - name: Integration tests
      #   run: pytest test/integration -v

      - name: Run Newman integration tests
        run: |
          docker pull postman/newman
          docker network ls
          docker run --rm \
           --network pipelinestraining2_app_network \
            -v "${{ github.workspace }}/utils/tests/postman:/etc/newman" \
            postman/newman run collectionRestAppTest.json

      - name: Run Artillery load test
        run: |
         docker run --rm \
          -v ${{ github.workspace }}/tests/performance:/home/node/artillery \
          artilleryio/artillery run test.yml

  ## 🚀 4.
  Deploy-prod:
    runs-on: ubuntu-latest
    needs: [Build, Set-vars, Deploy-dev]
    if: github.ref == 'refs/heads/elamCano_p2_base'
    environment:
      name: Production
      url: http://localhost:5000
    env:
      IMAGE_NAME: ${{ needs.set-vars.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" > .env

      - name: Set up Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Pull restapp image from Docker Hub
        run: docker pull elamcano/restapp:${{ env.IMAGE_NAME }}

      - name: Deploy redis and restapp with docker-compose
        run: docker-compose -f docker-compose.yml up -d

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies for integration test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Integration tests
        run: pytest test/integration -v
